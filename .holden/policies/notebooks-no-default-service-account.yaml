id: HLD_GCP_508
name: Vertex AI Notebooks and Workbench instances must not use the default Compute Engine service account
principle: identity-and-access
severity: HIGH
rationale: |
  If service_account (google_notebooks_instance) or
  gce_setup.service_accounts (google_workbench_instance) is left unset, GCP
  attaches the project's Compute Engine default service account to the
  underlying VM. That default account has historically carried the broad
  `Editor` role, and even where it doesn't, it's an ambient identity shared
  with every other unscoped workload in the project. Any code executed on
  the notebook — including arbitrary user-supplied notebook cells run
  through JupyterLab — inherits that identity's access, turning a single
  compromised or malicious notebook session into a path to broad project
  compromise. Holden already enforces this exact pattern for GCE instances,
  Cloud Run, Cloud Functions, Composer, and other compute-adjacent
  resources (see HLD_GCP_038); notebook and workbench instances carry the
  same risk but were not yet covered.
remediation: |
  Create a dedicated service account scoped to only the roles the notebook
  workload needs, and reference it explicitly:

  resource "google_notebooks_instance" "main" {
    service_account = google_service_account.notebooks.email
  }

  resource "google_workbench_instance" "main" {
    gce_setup {
      service_accounts {
        email = google_service_account.notebooks.email
      }
    }
  }
resources:
  google_notebooks_instance:
    all:
      - path: service_account
        not_null: true
      - path: service_account
        not_matches: ".*-compute@developer\\.gserviceaccount\\.com$"
  google_workbench_instance:
    all:
      - path: gce_setup.service_accounts.email
        not_null: true
      - path: gce_setup.service_accounts.email
        not_matches: ".*-compute@developer\\.gserviceaccount\\.com$"
